name: Test, Build & Deploy to Google Play Store

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Release Track'
        required: true
        default: 'beta'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

permissions:
  contents: write

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Run KMP & Android Unit Tests
        run: ./gradlew :shared:testAndroidHostTest :androidApp:test --stacktrace

      - name: Notify Telegram on Test Failure
        if: failure()
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            MESSAGE=$(printf "❌ <b>Sahaba Companions — Unit Tests Failed!</b>\n\n👤 <b>Author:</b> %s\n🔗 <a href='%s'>View Test Logs</a>" "${{ github.actor }}" "${RUN_URL}")
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "parse_mode=HTML" \
              --data-urlencode "text=${MESSAGE}"
          fi

  build-and-deploy:
    name: Build Signed AAB & Deploy to Play Store
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Increment Version Number (0.1.13) & Version Code (13)
        run: |
          python3 -c '
          import re
          with open("version.properties", "r") as f:
              content = f.read()
          
          patch = int(re.search(r"PATCH=(\d+)", content).group(1)) + 2
          code = int(re.search(r"VERSION_CODE=(\d+)", content).group(1)) + 2
          patch = max(patch, 13)
          code = max(code, 13)
          
          content = re.sub(r"PATCH=\d+", f"PATCH={patch}", content)
          content = re.sub(r"VERSION_CODE=\d+", f"VERSION_CODE={code}", content)
          
          with open("version.properties", "w") as f:
              f.write(content)
          '
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore(release): bump version to 0.1.13 (code 13) [skip ci]" || true
          git push origin master

      - name: Decode Keystore & Configure Signing
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > release-upload.jks
          ls -la release-upload.jks
          
          cat <<EOF > keystore.properties
          storeFile=release-upload.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS || 'sahaba-upload-key' }}
          keyPassword=${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          EOF

      - name: Build Signed AAB
        run: ./gradlew :androidApp:bundleRelease --stacktrace

      - name: Generate AI Notes & Await Telegram Approval
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/telegram_release_manager.py

      - name: Upload to Google Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONFIG_JSON }}
          packageName: com.aslmmovic.qurancompanion
          releaseFiles: androidApp/build/outputs/bundle/release/androidApp-release.aab
          track: ${{ github.event.inputs.track || 'beta' }}
          whatsNewDirectory: distribution/whatsnew
          status: completed

      - name: Send Telegram Notification
        if: always()
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            TRACK="${{ github.event.inputs.track || 'beta' }}"
            STATUS="${{ job.status }}"
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

            if [ "$STATUS" = "success" ]; then
              VERSION_NAME=$(grep -E '^(MAJOR|MINOR|PATCH)' version.properties | cut -d'=' -f2 | paste -sd'.' -)
              VERSION_CODE=$(grep -E '^VERSION_CODE' version.properties | cut -d'=' -f2)
              NOTES=$(cat distribution/whatsnew/whatsnew-en-US 2>/dev/null || echo "Release published successfully.")
              MESSAGE=$(printf "🚀 <b>Sahaba Companions — Deployed Successfully!</b>\n\n🏷 <b>Track:</b> <code>%s</code>\n📦 <b>Version:</b> <code>%s (%s)</code>\n\n📝 <b>What's New:</b>\n<pre>%s</pre>\n\n👤 <b>Author:</b> %s\n🔗 <a href='%s'>View GitHub Run</a>" "${TRACK}" "${VERSION_NAME}" "${VERSION_CODE}" "${NOTES}" "${{ github.actor }}" "${RUN_URL}")
            else
              MESSAGE=$(printf "❌ <b>Sahaba Companions — Deployment Failed or Cancelled!</b>\n\n🏷 <b>Track:</b> <code>%s</code>\n⚠️ <b>Status:</b> %s\n🔗 <a href='%s'>View Error Logs</a>" "${TRACK}" "${STATUS}" "${RUN_URL}")
            fi

            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "parse_mode=HTML" \
              --data-urlencode "text=${MESSAGE}"
          fi

