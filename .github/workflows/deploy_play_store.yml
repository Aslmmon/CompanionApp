name: Test, Build & Deploy to Google Play Store

on:
  pull_request:
    branches: [ "release" ]
    types: [ closed ]
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Run KMP & Android Unit Tests
        run: ./gradlew test

  build-and-deploy:
    name: Build Signed AAB & Deploy to Play Store
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Increment Version Number (+0.1)
        run: |
          python3 -c '
          import re
          with open("version.properties", "r") as f:
              content = f.read()
          
          minor = int(re.search(r"MINOR=(\d+)", content).group(1)) + 1
          code = int(re.search(r"VERSION_CODE=(\d+)", content).group(1)) + 1
          
          content = re.sub(r"MINOR=\d+", f"MINOR={minor}", content)
          content = re.sub(r"VERSION_CODE=\d+", f"VERSION_CODE={code}", content)
          
          with open("version.properties", "w") as f:
              f.write(content)
          '
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore(release): bump version to +0.1 [skip ci]" || true
          git push origin main || true

      - name: Decode Keystore File
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Build Signed AAB
        env:
          KEYSTORE_FILE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :androidApp:bundleRelease

      - name: Upload to Google Play Store
        uses: rslabs/action-google-play-publish@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONFIG_JSON }}
          packageName: com.aslmmovic.qurancompanion
          releaseFiles: androidApp/build/outputs/bundle/release/androidApp-release.aab
          track: internal
          status: completed
