name: Test, Build & Deploy to Google Play Store

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Release Track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - closed
          - production

permissions:
  contents: write

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Run KMP & Android Unit Tests
        run: ./gradlew :shared:testAndroidHostTest :androidApp:test --stacktrace

  build-and-deploy:
    name: Build Signed AAB & Deploy to Play Store
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Increment Version Number (+0.0.1)
        run: |
          python3 -c '
          import re
          with open("version.properties", "r") as f:
              content = f.read()
          
          patch = int(re.search(r"PATCH=(\d+)", content).group(1)) + 1
          code = int(re.search(r"VERSION_CODE=(\d+)", content).group(1)) + 1
          
          content = re.sub(r"PATCH=\d+", f"PATCH={patch}", content)
          content = re.sub(r"VERSION_CODE=\d+", f"VERSION_CODE={code}", content)
          
          with open("version.properties", "w") as f:
              f.write(content)
          '
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore(release): bump version to +0.0.1 [skip ci]" || true
          git push origin master

      - name: Decode Keystore & Configure Signing
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > release-upload.jks
          ls -la release-upload.jks
          
          cat <<EOF > keystore.properties
          storeFile=release-upload.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS || 'sahaba-upload-key' }}
          keyPassword=${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          EOF

      - name: Build Signed AAB
        run: ./gradlew :androidApp:bundleRelease --stacktrace

      - name: Upload to Google Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONFIG_JSON }}
          packageName: com.aslmmovic.qurancompanion
          releaseFiles: androidApp/build/outputs/bundle/release/androidApp-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
